name: exportar-base
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir w && cd w && npm i -s firebase-admin >/dev/null 2>&1
          echo "$SA" > sa.json
          cat > x.js <<'JS'
          const a=require('firebase-admin');a.initializeApp({credential:a.credential.cert(require('./sa.json'))});
          a.firestore().doc('base/b4').get().then(s=>{const d=s.data()||{};require('fs').writeFileSync('b4.json',JSON.stringify({version:d.version||'',updatedAt:d.updatedAt&&d.updatedAt.toDate?d.updatedAt.toDate().toISOString():(d.updatedAt||null),json:d.json||null}));process.exit(0)});
          JS
          node x.js && rm sa.json
          echo "" | base64 -d > pub.pem
          K=$(openssl rand -hex 32); gzip -9 b4.json
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:$K -in b4.json.gz -out m.bin
          echo -n $K | openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep | base64 -w0 > k.b64
          echo =====K=====; cat k.b64; echo; echo =====M=====; base64 -w0 m.bin; echo; echo =====FIM=====
