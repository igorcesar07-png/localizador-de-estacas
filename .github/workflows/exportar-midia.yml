# Temporário: exporta fotos do levantamento de bota-espera para relatório do administrador.
# Saída criptografada com a chave pública informada (só quem tem a chave privada abre). Removido após o uso.
name: Exportar mídia (temporário)
on:
  workflow_dispatch:
    inputs:
      ids: { description: 'ids das mídias, separados por vírgula', required: true }
      pub: { description: 'chave pública RSA (PEM em base64)', required: true }
jobs:
  exportar:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      IDS: ${{ github.event.inputs.ids }}
      PUB: ${{ github.event.inputs.pub }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Ler, reduzir e criptografar
        run: |
          set -e
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"; export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          mkdir -p "$RUNNER_TEMP/w" && cd "$RUNNER_TEMP/w" && npm i --silent firebase-admin@12 >/dev/null && pip install -q pillow >/dev/null
          mkdir out
          node -e '
            const a=require("firebase-admin");a.initializeApp();const db=a.firestore();const fs=require("fs");
            (async()=>{const meta={};for(const id of process.env.IDS.split(",")){const s=await db.collection("levantamento_bota_espera_midia").doc(id).get();
              if(!s.exists){meta[id]=null;continue}const d=s.data();const m=/^data:([^;]+);base64,(.*)$/.exec(d.data||"");
              if(m)fs.writeFileSync("out/"+id+".jpg",Buffer.from(m[2],"base64"));
              meta[id]={tipo:d.tipo,mime:d.mime,bytes:d.bytes,criado_em:d.criado_em,reg:d.reg}}
              fs.writeFileSync("out/meta.json",JSON.stringify(meta));console.log("ok",Object.keys(meta).length)})().catch(e=>{console.error(e.message);process.exit(1)})'
          python3 -c "
          import glob
          from PIL import Image, ImageOps
          for f in glob.glob('out/*.jpg'):
              im=ImageOps.exif_transpose(Image.open(f)).convert('RGB'); im.thumbnail((1600,1600)); im.save(f,'JPEG',quality=82,optimize=True)
          "
          tar czf m.tgz out
          openssl rand -hex 32 > k.txt
          printf '%s' "$PUB" | base64 -d > pub.pem
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -in m.tgz -out m.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.txt -out k.enc
          rm -rf out m.tgz k.txt "$RUNNER_TEMP/sa.json"
          echo "=====K=====";base64 -w 0 k.enc;echo;echo "=====M=====";base64 -w 4000 m.enc;echo "=====FIM====="
