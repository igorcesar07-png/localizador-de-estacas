<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Endereço desativado</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,sans-serif;background:#111;color:#eee;padding:16px;box-sizing:border-box}
.c{max-width:420px;background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:24px}h1{font-size:20px;margin:0 0 8px}a{display:block;margin-top:16px;text-align:center;background:#f5b400;color:#111;font-weight:700;padding:12px;border-radius:10px;text-decoration:none}p{color:#bbb;margin:8px 0}</style></head>
<body><div class="c"><h1>Este endereço foi desativado</h1>
<p>O Localizador de Estacas BR-277/PR agora exige login e está em:</p><p style="font-weight:700;color:#f5b400;text-align:center">localizador-estacas.web.app</p>
<a href="https://localizador-estacas.web.app">Abrir o novo endereço</a>
<p style="font-size:13px">Sem acesso? Peça a liberação ao administrador. Se o app estava instalado na Tela de Início, apague o ícone antigo e instale de novo pelo novo endereço.</p></div>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if(window.caches)caches.keys().then(k=>k.forEach(n=>caches.delete(n)));</script>
</body></html>
