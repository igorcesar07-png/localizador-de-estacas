<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Assinaturas · Neovia Restauração</title>
<link rel="stylesheet" href="lib/fonts.css">
<style>
:root{--ink:#141715;--muted:#5F6A64;--line:#D9DED9;--bg:#F4F6F3;--surface:#fff;--accent:#F2B705;--ok:#1E7A4C;--bad:#B42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Barlow,system-ui,sans-serif}
#as{max-width:980px;margin:0 auto;padding:16px 14px 60px}
.ah{display:flex;gap:14px;align-items:center;margin-bottom:10px}.ah img{height:30px}
h1{font:700 24px 'Barlow Condensed',system-ui;margin:4px 0 2px;letter-spacing:.01em}h2{font:700 13px Barlow,system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.as-sub{color:var(--muted);margin:0 0 10px}
.ak{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.ak div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}.ak dt{font-size:12px;color:var(--muted)}.ak dd{margin:0;font:700 18px Barlow,system-ui}
.ac{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
#pdfv{display:grid;gap:8px}.apg{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.al{list-style:none;margin:0;padding:0;display:grid;gap:6px}.al li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px 0}.al span{color:var(--muted)}
.af{display:grid;gap:4px;font-weight:600;margin-bottom:10px}.af input{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:500 16px Barlow,system-ui}
canvas#cv{width:100%;height:auto;aspect-ratio:3/1;border:2px dashed #9AA59F;border-radius:12px;background:#fff;touch-action:none}
.ar{display:flex;justify-content:flex-end;margin:6px 0}.ack{display:flex;gap:8px;align-items:center;margin:8px 0 12px;font-weight:600}.ack input{width:22px;height:22px}
.ab{min-height:48px;border:0;border-radius:12px;background:var(--accent);color:#111;font:700 16px Barlow,system-ui;padding:0 22px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.ab.sec{background:var(--surface);border:1px solid var(--line);color:var(--ink);min-height:40px;font-size:14px}.ab:disabled{opacity:.6}
.am{padding:12px 14px;border-radius:12px;background:#EAF1FB;color:#163A6B;margin:8px 0}.am.ok{background:#E2F4EA;color:#14532D}.am.bad{background:#FDE8E6;color:#7A1A12}
.asig{max-width:320px;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:8px}
.al li.ai{align-items:center}.ai div{display:grid;gap:2px;min-width:0}.ai span{font-size:14px}
[hidden]{display:none!important}
.af textarea{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:500 15px Barlow,system-ui;resize:vertical}.af small{font-weight:400;color:var(--muted)}
.abr{display:flex;gap:10px;flex-wrap:wrap}.ab.dvb{background:var(--surface);border:1px solid #E4A9A2;color:var(--bad)}.dv{color:var(--bad)}
@media(max-width:600px){.ak{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main id="as"><div class="am">Carregando…</div></main>
<script src="firebase-config.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="assinar.js"></script>
</body>
</html>
